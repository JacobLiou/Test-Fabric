services:
  postgres:
    image: postgres:16-alpine
    container_name: testfabric-pg
    environment:
      POSTGRES_USER: testfabric
      POSTGRES_PASSWORD: testfabric
      POSTGRES_DB: testfabric
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testfabric -d testfabric"]
      interval: 5s
      timeout: 3s
      retries: 10
